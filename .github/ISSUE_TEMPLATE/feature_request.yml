name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem would this solve? }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Proposed change }
  - type: checkboxes
    id: rules
    attributes:
      label: Checks
      options:
        - label: It keeps notes as plain files and works offline by default.
          required: true
        - label: It adds no telemetry and no network request without a visible user action.
